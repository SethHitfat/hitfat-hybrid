<!DOCTYPE html>
<html lang="ms">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
<title>HITFAT RUN CLUB</title>
<meta name="description" content="Kelab larian HITFAT: rakam larian dengan GPS, larian berpandu dengan coach, cabaran bulanan dan leaderboard.">
<meta name="theme-color" content="#000000">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="HITFAT RUN">
<link rel="manifest" href="/run/manifest.json">
<link rel="icon" type="image/png" sizes="32x32" href="/favicon-32.png">
<link rel="apple-touch-icon" href="/apple-touch-icon.png">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.css">
<style>
  @import url('https://fonts.googleapis.com/css2?family=Oswald:wght@500;600;700&family=Inter:wght@400;500;600;700;800&display=swap');
  :root{
    /* Same palette as HITFAT Hybrid: black page, cards a shade above, one red. */
    --bg:#000; --s1:#121212; --s2:#1C1C1C; --s3:#262626; --line:#262626;
    --txt:#fff; --dim:#9A9A9A; --dim2:#6E6E6E;
    --red:#F0392B; --red-solid:#D92C1A; --red-deep:#3A0B06;
    --ok:#2BD96B; --warn:#FFB020;
    --r:16px;
    --safe-b:env(safe-area-inset-bottom,0px); --safe-t:env(safe-area-inset-top,0px);
  }
  *{ box-sizing:border-box; -webkit-tap-highlight-color:transparent; }
  html,body{ margin:0; background:var(--bg); color:var(--txt); font-family:Inter,system-ui,-apple-system,"Segoe UI",sans-serif; }
  body{ overscroll-behavior:none; }
  button{ font:inherit; color:inherit; border:0; background:none; cursor:pointer; }
  input,select,textarea{ font:inherit; color:var(--txt); background:var(--s2); border:1px solid var(--line); border-radius:12px; padding:12px 14px; width:100%; }
  input:focus,select:focus,textarea:focus{ outline:2px solid var(--red); outline-offset:0; }
  .num{ font-family:Oswald,Impact,sans-serif; font-weight:700; letter-spacing:.01em; font-variant-numeric:tabular-nums; }
  .cap{ font-size:11px; font-weight:700; letter-spacing:.14em; text-transform:uppercase; color:var(--dim); }
  .hide{ display:none !important; }

  /* ---------- shell ---------- */
  #app{ max-width:560px; margin:0 auto; min-height:100vh; padding:calc(var(--safe-t) + 8px) 16px calc(92px + var(--safe-b)); }
  header.top{ display:flex; align-items:center; justify-content:space-between; padding:10px 0 14px; }
  .brand{ font-family:Oswald,sans-serif; font-weight:700; font-size:20px; letter-spacing:.04em; }
  .brand b{ color:var(--red); }
  .avatar{ width:36px; height:36px; border-radius:50%; background:var(--s2); display:grid; place-items:center; font-weight:800; font-size:14px; border:2px solid var(--lvl,#FFD60A); }
  h1.title{ font-family:Oswald,sans-serif; font-size:40px; line-height:1; margin:6px 0 18px; text-transform:uppercase; }
  h2.sec{ font-family:Oswald,sans-serif; font-size:22px; margin:26px 0 12px; text-transform:uppercase; letter-spacing:.02em; }
  .card{ background:var(--s1); border-radius:var(--r); padding:16px; }
  .row{ display:flex; gap:12px; align-items:center; }
  .grow{ flex:1; min-width:0; }
  .muted{ color:var(--dim); }
  .btn{ display:inline-flex; align-items:center; justify-content:center; gap:8px; padding:14px 18px; border-radius:999px; font-weight:800; font-size:15px; background:var(--s2); }
  .btn.red{ background:var(--red-solid); color:#fff; }
  .btn.white{ background:#fff; color:#000; }
  .btn.block{ width:100%; }
  .btn.sm{ padding:9px 14px; font-size:13px; }
  .pill{ display:inline-flex; padding:8px 14px; border-radius:999px; background:var(--s2); font-weight:700; font-size:13px; color:var(--dim); }
  .pill.on{ background:#fff; color:#000; }
  .pills{ display:flex; gap:8px; overflow-x:auto; scrollbar-width:none; padding-bottom:2px; }
  .pills::-webkit-scrollbar{ display:none; }

  /* ---------- bottom nav ---------- */
  nav.tabs{ position:fixed; left:0; right:0; bottom:0; z-index:20; background:rgba(0,0,0,.92); backdrop-filter:blur(14px); -webkit-backdrop-filter:blur(14px);
    border-top:1px solid var(--line); padding:8px 0 calc(8px + var(--safe-b)); }
  nav.tabs .in{ max-width:560px; margin:0 auto; display:grid; grid-template-columns:repeat(5,1fr); }
  nav.tabs button{ display:flex; flex-direction:column; align-items:center; gap:4px; font-size:10.5px; font-weight:700; color:var(--dim2); padding:4px 0; }
  nav.tabs button svg{ width:24px; height:24px; }
  nav.tabs button.on{ color:#fff; }
  nav.tabs button.on svg{ color:var(--red); }

  /* ---------- run tab ---------- */
  .gps{ display:inline-flex; align-items:center; gap:8px; font-size:12px; font-weight:700; color:var(--dim); }
  .gps i{ width:9px; height:9px; border-radius:50%; background:var(--dim2); }
  .gps.good i{ background:var(--ok); } .gps.ok i{ background:var(--warn); } .gps.bad i{ background:var(--red); }
  .runhero{ position:relative; border-radius:24px; overflow:hidden; height:46vh; min-height:300px; background:var(--s1); }
  #premap{ position:absolute; inset:0; }
  .runhero .shade{ position:absolute; inset:0; background:linear-gradient(180deg,rgba(0,0,0,.2),rgba(0,0,0,.05) 40%,rgba(0,0,0,.85)); pointer-events:none; z-index:400; }
  .runhero .over{ position:absolute; left:16px; right:16px; bottom:16px; z-index:401; }
  .goalset{ display:grid; grid-template-columns:repeat(4,1fr); gap:8px; margin:16px 0; }
  .goalset button{ background:var(--s1); border-radius:14px; padding:12px 6px; font-size:12px; font-weight:700; color:var(--dim); }
  .goalset button.on{ background:#fff; color:#000; }
  .goalval{ display:flex; align-items:center; justify-content:center; gap:18px; margin:4px 0 14px; }
  .goalval button{ width:44px; height:44px; border-radius:50%; background:var(--s2); font-size:22px; font-weight:700; }
  .goalval .v{ font-size:56px; line-height:1; min-width:150px; text-align:center; }
  .startbtn{ display:block; margin:8px auto 0; width:132px; height:132px; border-radius:50%; background:var(--red-solid); color:#fff;
    font-family:Oswald,sans-serif; font-size:30px; font-weight:700; letter-spacing:.04em; box-shadow:0 0 0 10px rgba(240,57,43,.16),0 18px 40px rgba(217,44,26,.35); }
  .startbtn:active{ transform:scale(.96); }
  .guidedchip{ display:flex; align-items:center; gap:12px; background:var(--s1); border-radius:14px; padding:12px; margin-top:16px; }

  /* ---------- live run (full screen) ---------- */
  #live{ position:fixed; inset:0; z-index:50; background:var(--red-solid); color:#fff; display:flex; flex-direction:column; padding:calc(var(--safe-t) + 14px) 20px calc(24px + var(--safe-b)); }
  #live.paused{ background:#000; }
  #live .lv-top{ display:flex; justify-content:space-between; align-items:center; font-weight:700; font-size:13px; }
  #live .lv-main{ flex:1; display:flex; flex-direction:column; justify-content:center; align-items:center; text-align:center; }
  #live .big{ font-size:min(32vw,170px); line-height:.9; }
  #live .unit{ font-family:Oswald,sans-serif; font-size:20px; font-weight:600; opacity:.85; margin-top:6px; text-transform:uppercase; letter-spacing:.08em; }
  #live .trio{ display:grid; grid-template-columns:repeat(3,1fr); gap:8px; width:100%; margin-top:36px; }
  #live .trio .num{ font-size:34px; line-height:1; }
  #live .trio .l{ font-size:11px; font-weight:700; letter-spacing:.12em; text-transform:uppercase; opacity:.75; margin-top:6px; }
  #live .seg{ background:rgba(0,0,0,.22); border-radius:16px; padding:12px 14px; width:100%; text-align:left; margin-bottom:22px; }
  #live.paused .seg{ background:var(--s1); }
  #live .seg .bar{ height:5px; border-radius:3px; background:rgba(255,255,255,.25); margin-top:10px; overflow:hidden; }
  #live .seg .bar i{ display:block; height:100%; background:#fff; width:0; }
  #live .ctrls{ display:flex; justify-content:center; align-items:center; gap:28px; }
  .round{ width:84px; height:84px; border-radius:50%; display:grid; place-items:center; background:#000; color:#fff; }
  .round svg{ width:34px; height:34px; }
  .round.white{ background:#fff; color:#000; }
  .round.sm{ width:58px; height:58px; background:rgba(0,0,0,.25); }
  .round.sm svg{ width:24px; height:24px; }
  #live.paused .round.sm{ background:var(--s2); }
  .hold{ position:relative; overflow:hidden; }
  .hold .fill{ position:absolute; inset:0; background:var(--red); transform:scaleY(0); transform-origin:bottom; transition:transform .1s linear; }
  .hold svg,.hold span{ position:relative; }
  #live .holdhint{ text-align:center; font-size:12px; font-weight:700; opacity:.7; margin-top:12px; min-height:16px; }
  #livemap{ position:absolute; inset:0; z-index:0; }
  #live.mapmode .lv-main .big,#live.mapmode .lv-main .unit{ display:none; }
  #live .mapwrap{ display:none; position:relative; width:100%; flex:1; border-radius:20px; overflow:hidden; margin:14px 0; }
  #live.mapmode .mapwrap{ display:block; }
  #live.mapmode .lv-main{ flex:0; }
  #live.mapmode .trio{ margin-top:0; }

  #countdown{ position:fixed; inset:0; z-index:60; background:var(--red-solid); display:grid; place-items:center; font-size:46vw; color:#fff; }

  /* ---------- activity ---------- */
  .totals .big{ font-size:76px; line-height:.95; }
  .stat3{ display:grid; grid-template-columns:repeat(3,1fr); gap:10px; margin-top:16px; }
  .stat3 .num{ font-size:24px; line-height:1; }
  .stat3 .l{ font-size:11px; color:var(--dim); font-weight:600; margin-top:4px; }
  .chart{ margin-top:18px; }
  .chart svg{ width:100%; height:130px; display:block; }
  .lvl{ display:flex; align-items:center; gap:14px; }
  .lvl .dot{ width:54px; height:54px; border-radius:50%; flex:none; display:grid; place-items:center; color:#000; font-weight:800; font-size:12px; }
  .prog{ height:8px; background:var(--s3); border-radius:4px; overflow:hidden; margin-top:8px; }
  .prog i{ display:block; height:100%; background:var(--red); border-radius:4px; }
  .runitem{ display:flex; gap:14px; align-items:center; padding:14px 0; border-bottom:1px solid var(--line); }
  .runitem:last-child{ border-bottom:0; }
  .runitem .thumb{ width:62px; height:62px; flex:none; border-radius:14px; background:var(--s2); display:grid; place-items:center; overflow:hidden; }
  .runitem .thumb svg{ width:100%; height:100%; }
  .runitem .km{ font-size:28px; line-height:1; }
  .runitem .meta{ font-size:12px; color:var(--dim); margin-top:4px; }
  .prgrid{ display:grid; grid-template-columns:1fr 1fr; gap:10px; }
  .prgrid .card .num{ font-size:26px; }

  /* ---------- guided ---------- */
  .gcard{ position:relative; border-radius:20px; overflow:hidden; min-height:170px; padding:18px; display:flex; flex-direction:column; justify-content:flex-end; margin-bottom:12px; text-align:left; width:100%; }
  .gcard .t{ font-family:Oswald,sans-serif; font-size:28px; line-height:1.02; text-transform:uppercase; }
  .gcard .m{ font-size:12px; font-weight:700; opacity:.85; margin-top:6px; letter-spacing:.04em; }
  .gcard .tag{ position:absolute; top:16px; left:18px; font-size:11px; font-weight:800; letter-spacing:.12em; text-transform:uppercase; background:rgba(0,0,0,.35); padding:5px 9px; border-radius:999px; }
  .gcard .done{ position:absolute; top:16px; right:18px; font-size:11px; font-weight:800; background:#fff; color:#000; padding:5px 9px; border-radius:999px; }
  .segs{ display:flex; gap:3px; height:28px; align-items:flex-end; margin:16px 0; }
  .segs i{ display:block; border-radius:3px; }

  /* ---------- club ---------- */
  .chal{ background:linear-gradient(150deg,var(--red-solid),#7a160c); border-radius:22px; padding:20px; }
  .chal .num{ font-size:60px; line-height:.95; }
  .chal .prog{ background:rgba(0,0,0,.3); height:10px; border-radius:5px; }
  .chal .prog i{ background:#fff; }
  .lb{ display:flex; align-items:center; gap:12px; padding:12px 0; border-bottom:1px solid var(--line); }
  .lb:last-child{ border-bottom:0; }
  .lb .rk{ width:28px; font-family:Oswald,sans-serif; font-size:20px; color:var(--dim); text-align:center; }
  .lb.me{ background:var(--red-deep); margin:0 -16px; padding:12px 16px; border-radius:12px; border-bottom:0; }
  .lb .km{ font-size:20px; }
  .badges{ display:grid; grid-template-columns:repeat(3,1fr); gap:10px; }
  .badge{ background:var(--s1); border-radius:16px; padding:14px 8px; text-align:center; }
  .badge .ic{ width:56px; height:56px; margin:0 auto 8px; border-radius:50%; display:grid; place-items:center; font-size:26px; background:var(--s3); filter:grayscale(1); opacity:.45; }
  .badge.got .ic{ background:var(--red-solid); filter:none; opacity:1; }
  .badge .n{ font-size:12px; font-weight:700; line-height:1.25; }
  .badge .d{ font-size:10.5px; color:var(--dim); margin-top:4px; line-height:1.3; }

  /* ---------- profile ---------- */
  .setrow{ display:flex; align-items:center; justify-content:space-between; gap:12px; padding:14px 0; border-bottom:1px solid var(--line); }
  .setrow:last-child{ border-bottom:0; }
  .sw{ position:relative; width:50px; height:30px; flex:none; }
  .sw input{ position:absolute; opacity:0; inset:0; margin:0; cursor:pointer; z-index:1; }
  .sw i{ position:absolute; inset:0; background:var(--s3); border-radius:15px; transition:.2s; }
  .sw i::after{ content:""; position:absolute; top:3px; left:3px; width:24px; height:24px; border-radius:50%; background:#fff; transition:.2s; }
  .sw input:checked + i{ background:var(--red-solid); }
  .sw input:checked + i::after{ transform:translateX(20px); }

  /* ---------- sheet / modal ---------- */
  #sheet{ position:fixed; inset:0; z-index:70; background:rgba(0,0,0,.7); display:flex; align-items:flex-end; justify-content:center; }
  #sheet .box{ background:var(--s1); width:100%; max-width:560px; max-height:92vh; overflow-y:auto; border-radius:24px 24px 0 0; padding:20px 16px calc(24px + var(--safe-b)); }
  #sheet .grab{ width:40px; height:5px; border-radius:3px; background:var(--s3); margin:0 auto 16px; }
  #sheet h3{ font-family:Oswald,sans-serif; font-size:26px; margin:0 0 12px; text-transform:uppercase; }
  #sheet label{ display:block; font-size:12px; font-weight:700; color:var(--dim); margin:14px 0 6px; }
  .msg{ font-size:13px; margin-top:10px; min-height:18px; color:var(--dim); }
  .msg.err{ color:#ff7b70; }

  /* ---------- run detail ---------- */
  #detail{ position:fixed; inset:0; z-index:65; background:var(--bg); overflow-y:auto; }
  #detail .in{ max-width:560px; margin:0 auto; padding:calc(var(--safe-t) + 10px) 16px calc(40px + var(--safe-b)); }
  #detmap{ height:300px; border-radius:20px; overflow:hidden; background:var(--s1); }
  .dgrid{ display:grid; grid-template-columns:1fr 1fr; gap:18px 12px; margin:20px 0; }
  .dgrid .num{ font-size:30px; line-height:1; }
  .dgrid .l{ font-size:12px; color:var(--dim); font-weight:600; margin-top:4px; }
  .splits .sp{ display:grid; grid-template-columns:34px 64px 1fr; gap:10px; align-items:center; padding:7px 0; font-size:14px; }
  .splits .sp .b{ height:14px; border-radius:3px; background:var(--s3); }
  .splits .sp .b i{ display:block; height:100%; border-radius:3px; background:var(--red); }
  .splits .sp.best .b i{ background:#fff; }
  .feel{ display:flex; gap:8px; }
  .feel button{ flex:1; background:var(--s2); border-radius:14px; padding:10px 0; font-size:24px; }
  .feel button.on{ background:#fff; }
  .toast{ position:fixed; left:50%; bottom:calc(100px + var(--safe-b)); transform:translateX(-50%) translateY(20px); background:#fff; color:#000; font-weight:700; font-size:14px;
    padding:12px 18px; border-radius:999px; opacity:0; transition:.25s; z-index:90; pointer-events:none; max-width:90vw; text-align:center; }
  .toast.on{ opacity:1; transform:translateX(-50%) translateY(0); }
  /* Leaflet's panes carry z-indexes up to 1000; keep them inside their own box. */
  .runhero,#detmap,#live .mapwrap{ isolation:isolate; }
  .leaflet-container{ background:#111; }
  /* OSM's standard tiles, darkened, so no tile API key is needed */
  .leaflet-tile-pane{ filter:invert(1) hue-rotate(180deg) brightness(.85) contrast(.9) saturate(.35); }
  .leaflet-control-attribution{ font-size:9px; background:rgba(0,0,0,.55) !important; color:#999 !important; }
  .leaflet-control-attribution a{ color:#bbb !important; }
  .me-dot{ width:18px; height:18px; border-radius:50%; background:var(--red); border:3px solid #fff; box-shadow:0 0 0 8px rgba(240,57,43,.25); }
</style>
</head>
<body>

<div id="app">
  <header class="top">
    <div class="brand">HITFAT <b>RUN</b> CLUB</div>
    <button class="avatar" id="hdr-avatar" onclick="go('profile')" aria-label="Profil">?</button>
  </header>
  <main id="view"></main>
</div>

<nav class="tabs" aria-label="Navigasi">
  <div class="in">
    <button data-tab="run" onclick="go('run')">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="14" cy="4" r="2"/><path d="M8 21l3-6 3 2v5M6 12l3-4 4 1 3 3 3 1M11 15l-1-3"/></svg>Larian</button>
    <button data-tab="guided" onclick="go('guided')">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 14v-2a9 9 0 0 1 18 0v2"/><rect x="2" y="14" width="5" height="7" rx="2"/><rect x="17" y="14" width="5" height="7" rx="2"/></svg>Berpandu</button>
    <button data-tab="activity" onclick="go('activity')">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 20V10M10 20V4M16 20v-7M22 20H2"/></svg>Aktiviti</button>
    <button data-tab="club" onclick="go('club')">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M8 21h8M12 17v4M7 4h10v5a5 5 0 0 1-10 0V4zM7 6H4a3 3 0 0 0 3 4M17 6h3a3 3 0 0 1-3 4"/></svg>Kelab</button>
    <button data-tab="profile" onclick="go('profile')">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="8" r="4"/><path d="M4 21a8 8 0 0 1 16 0"/></svg>Profil</button>
  </div>
</nav>

<!-- live run screen -->
<div id="live" class="hide">
  <div class="lv-top">
    <span id="lv-gps" class="gps"><i></i><span>GPS</span></span>
    <span id="lv-state">LARIAN</span>
    <span id="lv-clock" style="font-weight:700"></span>
  </div>
  <div class="mapwrap"><div id="livemap"></div></div>
  <div class="lv-main">
    <div id="lv-seg" class="seg hide">
      <div class="row"><div class="grow"><div class="cap" style="color:inherit;opacity:.75" id="lv-seg-n">SEGMEN</div>
        <div style="font-weight:800;font-size:18px;margin-top:2px" id="lv-seg-t">Warm-up</div></div>
        <div class="num" style="font-size:26px" id="lv-seg-r">0:00</div></div>
      <div class="bar"><i id="lv-seg-bar"></i></div>
    </div>
    <div class="big num" id="lv-big">0.00</div>
    <div class="unit" id="lv-unit">Kilometer</div>
    <div class="trio">
      <div><div class="num" id="lv-a">--</div><div class="l" id="lv-al">Pace</div></div>
      <div><div class="num" id="lv-b">0:00</div><div class="l">Masa</div></div>
      <div><div class="num" id="lv-c">0</div><div class="l">Kalori</div></div>
    </div>
  </div>
  <div style="margin-top:28px">
    <div class="ctrls" id="lv-run-ctrls">
      <button class="round sm" id="lv-mapbtn2" onclick="Live.toggleMap()" aria-label="Peta"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linejoin="round"><path d="M9 4L3 6v14l6-2 6 2 6-2V4l-6 2-6-2zM9 4v14M15 6v14"/></svg></button>
      <button class="round" onclick="Live.pause()" aria-label="Pause"><svg viewBox="0 0 24 24" fill="currentColor"><rect x="6" y="4" width="4" height="16" rx="1"/><rect x="14" y="4" width="4" height="16" rx="1"/></svg></button>
      <button class="round sm" onclick="Live.speakStatus()" aria-label="Status suara"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M11 5L6 9H2v6h4l5 4V5zM15.5 8.5a5 5 0 0 1 0 7M19 5a10 10 0 0 1 0 14"/></svg></button>
    </div>
    <div class="ctrls hide" id="lv-pause-ctrls">
      <button class="round hold" id="lv-end" aria-label="Tekan lama untuk tamat"><span class="fill"></span><svg viewBox="0 0 24 24" fill="currentColor"><rect x="6" y="6" width="12" height="12" rx="2"/></svg></button>
      <button class="round white" onclick="Live.resume()" aria-label="Sambung"><svg viewBox="0 0 24 24" fill="currentColor"><path d="M7 4l13 8-13 8z"/></svg></button>
    </div>
    <div class="holdhint" id="lv-hint"></div>
  </div>
</div>

<div id="countdown" class="hide num" onclick="Live.skipCountdown()">3</div>
<div id="detail" class="hide"></div>

/* ---------- geo ---------- */
function haversine(a,b){ const R=6371000, r=Math.PI/180;
  const dLat=(b[0]-a[0])*r, dLng=(b[1]-a[1])*r;
  const x=Math.sin(dLat/2)**2 + Math.cos(a[0]*r)*Math.cos(b[0]*r)*Math.sin(dLng/2)**2;
  return 2*R*Math.asin(Math.sqrt(x)); }
/* Keep a saved route small: never more than ~600 points, 5 decimals (~1 m). */
function thinRoute(pts, max){ max=max||600; if(pts.length<=max) return pts.map(p=>[+p[0].toFixed(5),+p[1].toFixed(5)]);
  const step=pts.length/max, out=[]; for(let i=0;i<max;i++) out.push(pts[Math.floor(i*step)]);
  out.push(pts[pts.length-1]); return out.map(p=>[+p[0].toFixed(5),+p[1].toFixed(5)]); }
function routeSVG(route, color, pad){
  if(!route || route.length<2) return '';
  pad=pad==null?8:pad; const W=100, H=100;
  const lat0=route[0][0]*Math.PI/180, k=Math.cos(lat0);
  const xs=route.map(p=>p[1]*k), ys=route.map(p=>-p[0]);
  const minX=Math.min(...xs), maxX=Math.max(...xs), minY=Math.min(...ys), maxY=Math.max(...ys);
  const span=Math.max(maxX-minX, maxY-minY) || 1e-6, s=(W-2*pad)/span;
  const ox=(W-(maxX-minX)*s)/2, oy=(H-(maxY-minY)*s)/2;
  const d=xs.map((x,i)=>(i?'L':'M')+((x-minX)*s+ox).toFixed(1)+' '+((ys[i]-minY)*s+oy).toFixed(1)).join('');
  return `<svg viewBox="0 0 ${W} ${H}"><path d="${d}" fill="none" stroke="${color||'#F0392B'}" stroke-width="3.2" stroke-linecap="round" stroke-linejoin="round"/></svg>`;
}
/* Fastest time over `dist` metres anywhere in the run, from [elapsedSec, cumMetres] pairs. */
function bestEffort(trace, dist){
  if(!trace || trace.length<2 || trace[trace.length-1][1] < dist) return null;
  let best=Infinity, i=0;
  for(let j=1;j<trace.length;j++){
    while(i+1<j && trace[j][1]-trace[i+1][1] >= dist) i++;
    const dd=trace[j][1]-trace[i][1];
    if(dd>=dist){ const t=(trace[j][0]-trace[i][0])*dist/dd; if(t<best) best=t; }
  }
  return isFinite(best) ? Math.round(best) : null;
}

/* ═══════════════ STORE ═══════════════ */
const RC = {
  KEY:'hitfat_run_v1', userId:null, email:null, meta:null,
  data:null,
  defaults(){ return { profile:{ name:'', weightKg:65, voice:true, kmCues:true, autoPause:false, indoor:false, upd:0 },
    challenges:{}, runs:[], deleted:[], badges:{} }; },
  cacheKey(){ return this.KEY + (this.userId?'_'+this.userId:''); },
  load(){ this.data=this.defaults();
    try{ const r=localStorage.getItem(this.cacheKey());
      if(r) this.apply(JSON.parse(r)); }catch(e){} },
  apply(o){ const d=this.defaults(); if(o && typeof o==='object'){
      Object.assign(d.profile, o.profile||{}); d.challenges=Object.assign({}, o.challenges||{});
      d.runs=Array.isArray(o.runs)?o.runs.filter(r=>r&&r.id):[]; d.deleted=Array.isArray(o.deleted)?o.deleted.slice():[];
      d.badges=Object.assign({}, o.badges||{}); }
    this.data=d; this.sort(); },
  sort(){ this.data.runs.sort((a,b)=>b.start-a.start); },
  save(){ try{ localStorage.setItem(this.cacheKey(), JSON.stringify(this.data)); }catch(e){ console.warn('save failed', e); } this.push(); },
  /* Two devices can both log runs offline, so a pull is a merge, never a replace. */
  merge(remote){
    if(!remote) return;
    const del=new Set([...(this.data.deleted||[]), ...(remote.deleted||[])]);
    const byId={};
    [...(remote.runs||[]), ...this.data.runs].forEach(r=>{ if(!r||!r.id||del.has(r.id)) return;
      const cur=byId[r.id]; if(!cur || (r.upd||0) > (cur.upd||0)) byId[r.id]=r; });
    this.data.runs=Object.values(byId); this.data.deleted=[...del].slice(-500);
    if(remote.profile && (remote.profile.upd||0) > (this.data.profile.upd||0)) Object.assign(this.data.profile, remote.profile);
    this.data.challenges=Object.assign({}, remote.challenges||{}, this.data.challenges);
    this.data.badges=Object.assign({}, remote.badges||{}, this.data.badges);
    this.sort();
  },
  push(){ if(!sb || !this.userId || Cloud.ready===false) return;
    clearTimeout(this._t);
    this._t=setTimeout(async()=>{
      const { error } = await sb.from('run_data').upsert({ user_id:this.userId, data:this.data, updated_at:new Date().toISOString() }, { onConflict:'user_id' });
      if(error){ if(tableMissing(error)) Cloud.ready=false; console.warn('cloud save failed', error.message); } else Cloud.ready=true;
    }, 800); },
  async pull(){ if(!sb || !this.userId) return;
    const { data:row, error } = await sb.from('run_data').select('data').eq('user_id', this.userId).maybeSingle();
    if(error){ if(tableMissing(error)) Cloud.ready=false; console.warn('cloud load failed', error.message); return; }
    Cloud.ready=true;
    if(row && row.data) this.merge(row.data);
    try{ localStorage.setItem(this.cacheKey(), JSON.stringify(this.data)); }catch(e){}
    this.push(); },
  runs(){ return this.data.runs; },
  getRun(id){ return this.data.runs.find(r=>r.id===id); },
  addRun(r){ r.upd=Date.now(); this.data.runs.push(r); this.sort(); this.save(); Club.post(r); checkBadges(); },
  updateRun(r){ r.upd=Date.now(); this.save(); Club.post(r); },
  deleteRun(id){ this.data.runs=this.data.runs.filter(r=>r.id!==id); this.data.deleted.push(id); this.save(); Club.remove(id); },
  setProfile(k,v){ this.data.profile[k]=v; this.data.profile.upd=Date.now(); this.save(); },
  displayName(){ const p=this.data.profile; if(p.name) return p.name;
    const m=this.meta||{}; return m.full_name || m.name || (this.email ? this.email.split('@')[0] : 'Pelari'); },
  totals(since, until){ let dist=0, dur=0, n=0; until=until||Infinity;
    this.data.runs.forEach(r=>{ if(r.start>=since && r.start<until){ dist+=r.dist; dur+=r.dur; n++; } });
    return { dist, dur, n }; },
};

/* ═══════════════ CLUB (shared leaderboard rows) ═══════════════ */
const Club = {
  row(r){ return { id:r.id, user_id:RC.userId, display_name:RC.displayName().slice(0,40), started_at:new Date(r.start).toISOString(),
    distance_m:Math.round(r.dist), duration_s:Math.max(1,Math.round(r.dur)) }; },
  /* The database refuses anything faster than ~2:23/km, so a GPS glitch can't top the board. */
  ok(r){ return r.dist>=200 && r.dist <= r.dur*7; },
  async post(r){ if(!sb || !RC.userId || Cloud.clubReady===false || !this.ok(r)) return;
    const { error } = await sb.from('run_club_runs').upsert(this.row(r), { onConflict:'id' });
    if(error){ if(tableMissing(error)) Cloud.clubReady=false; console.warn('club post failed', error.message); } else Cloud.clubReady=true; },
  async remove(id){ if(!sb || !RC.userId || Cloud.clubReady===false) return;
    await sb.from('run_club_runs').delete().eq('id', id); },
  async backfill(){ if(!sb || !RC.userId) return;
    const rows=RC.runs().filter(r=>this.ok(r)).map(r=>this.row(r));
    for(let i=0;i<rows.length;i+=200){
      const { error } = await sb.from('run_club_runs').upsert(rows.slice(i,i+200), { onConflict:'id' });
      if(error){ if(tableMissing(error)) Cloud.clubReady=false; return; }
    }
    Cloud.clubReady=true; },
  async board(since){
    if(!sb) return { error:'offline' };
    if(!RC.userId) return { error:'login' };
    const { data, error } = await sb.from('run_club_runs').select('user_id,display_name,distance_m,duration_s,started_at')
      .gte('started_at', new Date(since).toISOString()).limit(10000);
    if(error){ if(tableMissing(error)){ Cloud.clubReady=false; return { error:'setup' }; } return { error:error.message }; }
    Cloud.clubReady=true;
    const by={};
    (data||[]).forEach(r=>{ const b=by[r.user_id]||(by[r.user_id]={ id:r.user_id, name:r.display_name, dist:0, dur:0, n:0, last:'' });
      b.dist+=r.distance_m; b.dur+=r.duration_s; b.n++; if(r.started_at>b.last){ b.last=r.started_at; b.name=r.display_name; } });
    return { rows:Object.values(by).sort((a,b)=>b.dist-a.dist) };
  },
};

const Voice = {
  voice:null, ctx:null,
  init(){ if(!('speechSynthesis' in window)) return;
    const pick=()=>{ const vs=speechSynthesis.getVoices();
      this.voice = vs.find(v=>/^ms/i.test(v.lang)) || vs.find(v=>/^id/i.test(v.lang)) || null; };
    pick(); speechSynthesis.onvoiceschanged=pick; },
  /* iOS only lets audio start from a tap, so START primes both engines. */
  unlock(){ try{ if('speechSynthesis' in window){ const u=new SpeechSynthesisUtterance(' '); u.volume=0; speechSynthesis.speak(u); } }catch(e){}
    try{ this.ctx=this.ctx||new (window.AudioContext||window.webkitAudioContext)(); if(this.ctx.state==='suspended') this.ctx.resume(); }catch(e){} },
  say(text, force){ if(!force && !RC.data.profile.voice) return; if(!('speechSynthesis' in window)) return;
    try{ const u=new SpeechSynthesisUtterance(text); u.lang=this.voice?this.voice.lang:'ms-MY'; if(this.voice) u.voice=this.voice; u.rate=1.02;
      speechSynthesis.speak(u); }catch(e){} },
  beep(n, hi){ if(!this.ctx) return; n=n||1;
    for(let i=0;i<n;i++){ try{ const o=this.ctx.createOscillator(), g=this.ctx.createGain(), t=this.ctx.currentTime+i*0.22;
      o.frequency.value=hi?1320:880; o.connect(g); g.connect(this.ctx.destination);
      g.gain.setValueAtTime(0.0001,t); g.gain.exponentialRampToValueAtTime(0.35,t+0.02); g.gain.exponentialRampToValueAtTime(0.0001,t+0.16);
      o.start(t); o.stop(t+0.18); }catch(e){} } },
  paceWords(spk){ if(!isFinite(spk)) return ''; const s=Math.round(spk); return Math.floor(s/60)+' minit '+(s%60)+' saat'; },
  durWords(sec){ sec=Math.round(sec); const h=Math.floor(sec/3600), m=Math.floor(sec%3600/60), s=sec%60;
    return (h?h+' jam ':'')+(m?m+' minit ':'')+(s&&!h?s+' saat':'').trim(); },
};

/* ═══════════════ LIVE RUN ENGINE ═══════════════ */
const Live = {
  st:null, watchId:null, tick:null, wake:null, map:null, mapLine:null, mapMe:null, warmWatch:null, lastFix:null,
  /* goal: {type:'free'|'dist'|'time', v}  — v in metres or seconds */
  async begin(goal, guidedId){
    Voice.unlock();
    const indoor=RC.data.profile.indoor;
    if(!indoor && !('geolocation' in navigator)){ toast('Peranti ini tiada GPS. Guna mod Indoor.'); return; }
    this.st={ id:uid(), status:'countdown', goal:goal||{type:'free'}, guided:guidedId||null, indoor,
      start:0, acc:0, resumeAt:0, dist:0, pts:[], trace:[], splits:[], last:null,
      segIdx:-1, segStartE:0, segStartD:0, tipsDone:{}, goalHalf:false, goalDone:false, autoPaused:false, stillSince:0 };
    if(!indoor) this.startWatch();
    $('live').classList.remove('hide','paused','mapmode'); document.body.style.overflow='hidden';
    this.render();
    this.requestWake();
    await this.countdown();
    if(!this.st) return;
    const now=Date.now(); this.st.start=now; this.st.resumeAt=now; this.st.status='running';
    Voice.beep(1,true);

/* hold-to-end, like every serious run app: a pocket tap must never end a run */
(function(){ const b=$('lv-end'); let t=null, start=0;
  const fill=b.querySelector('.fill');

    t=setInterval(()=>{ const f=clamp((Date.now()-start)/1000,0,1); fill.style.transform='scaleY('+f+')';

  const up=()=>{ clearInterval(t); t=null; fill.style.transform='scaleY(0)'; if(Live.st && Live.st.status==='paused') $('lv-hint').textContent='Tahan ■ untuk tamat'; };

/* ═══════════════ STATS / LEVELS / PRs / BADGES ═══════════════ */
const LEVELS=[
  { n:'Kuning', km:0, c:'#FFD60A' }, { n:'Oren', km:50, c:'#FF8A00' }, { n:'Hijau', km:250, c:'#2BD96B' },
  { n:'Biru', km:1000, c:'#2F80FF' }, { n:'Ungu', km:2500, c:'#9B5CFF' }, { n:'Hitam', km:5000, c:'#E5E5E5' },
  { n:'Merah HITFAT', km:15000, c:'#F0392B' } ];
function levelOf(km){ let i=0; LEVELS.forEach((l,k)=>{ if(km>=l.km) i=k; }); const cur=LEVELS[i], nxt=LEVELS[i+1]||null;
  return { i, cur, nxt, f: nxt ? (km-cur.km)/(nxt.km-cur.km) : 1, left: nxt ? nxt.km-km : 0 }; }
function lifetimeKm(){ return RC.runs().reduce((s,r)=>s+r.dist,0)/1000; }
function computePRs(){ const out={}; RC.runs().forEach(r=>{ Object.entries(r.best||{}).forEach(([m,t])=>{ if(!out[m] || t<out[m].t) out[m]={ t, id:r.id, start:r.start }; }); });
  const longest=RC.runs().reduce((a,r)=>!a||r.dist>a.dist?r:a, null); if(longest) out.longest={ d:longest.dist, id:longest.id, start:longest.start };
  return out; }
function dayKey(ms){ const d=new Date(ms); return d.getFullYear()*10000+(d.getMonth()+1)*100+d.getDate(); }
function streakDays(){ const days=new Set(RC.runs().map(r=>dayKey(r.start))); let best=0, cur=0, prev=null;
  [...days].sort().forEach(k=>{ const d=new Date(Math.floor(k/10000), Math.floor(k/100)%100-1, k%100);
    cur = prev && (d-prev)/864e5===1 ? cur+1 : 1; best=Math.max(best,cur); prev=d; });
  return best; }
const BADGES=[

/* ---------- RUN TAB ---------- */
function stopWarm(){ if(Live.warmWatch!=null) navigator.geolocation.clearWatch(Live.warmWatch); Live.warmWatch=null; }

  Live.warmWatch=navigator.geolocation.watchPosition(p=>{ setGps(p.coords.accuracy);
    const pt=[p.coords.latitude,p.coords.longitude];
    if(preMap){ if(!preMap._me) preMap._me=L.marker(pt,{ icon:L.divIcon({ className:'', html:'<div class="me-dot"></div>', iconSize:[18,18], iconAnchor:[9,9] }) }).addTo(preMap);
      else preMap._me.setLatLng(pt);
      if(!preMap._centered){ preMap.setView(pt,16); preMap._centered=true; } } },
    ()=>setGps(null), { enableHighAccuracy:true, maximumAge:5000, timeout:20000 });
}
function renderRun(){

      <div class="muted" style="font-size:13px;margin:6px 0 14px">Larian kau tetap disimpan dalam telefon walaupun tak log masuk.</div>
      <button class="btn red sm" onclick="openLogin()">Log masuk</button></div>`; return; }
  if(res.error==='setup'){ el.innerHTML=`<div class="muted" style="padding:22px 0;text-align:center;font-size:14px">Leaderboard belum diaktifkan.<br>Admin perlu jalankan <code>run/SETUP.sql</code> dalam Supabase.</div>`; return; }
  if(res.error){ el.innerHTML=`<div class="muted" style="padding:22px 0;text-align:center">Tak dapat muat leaderboard. Cuba lagi nanti.</div>`; return; }
  const rows=res.rows; if(!rows.length){ el.innerHTML=`<div class="muted" style="padding:22px 0;text-align:center">Belum ada larian ${lbRange==='week'?'minggu':'bulan'} ini. Jadi yang pertama!</div>`; return; }
  const myIdx=rows.findIndex(r=>r.id===RC.userId), top=rows.slice(0,50);
  el.innerHTML = top.map((r,i)=>lbRow(r,i)).join('') + (myIdx>=50 ? `<div class="muted" style="text-align:center;padding:4px 0">⋯</div>`+lbRow(rows[myIdx],myIdx) : '');
}
function lbRow(r,i){ const me=r.id===RC.userId;
  return `<div class="lb ${me?'me':''}"><div class="rk">${i<3?['🥇','🥈','🥉'][i]:i+1}</div>
    <div class="avatar" style="--lvl:#333">${esc((r.name||'?').charAt(0).toUpperCase())}</div>
    <div class="grow"><div style="font-weight:700;white-space:nowrap;overflow:hidden;text-overflow:ellipsis">${esc(r.name)}${me?' (kau)':''}</div>
      <div class="muted" style="font-size:12px">${r.n} larian · ${fmtPace(paceOf(r.dur,r.dist))}/km</div></div>
    <div class="km num">${fmtKm(r.dist,1)}</div></div>`; }
function pickChallenge(){ const mk=monthKey(), cur=RC.data.challenges[mk];
  openSheet(`<h3>Cabaran ${BULAN[new Date().getMonth()]}</h3><p class="muted" style="font-size:14px;margin-top:-4px">Pilih jumlah kilometer untuk bulan ini.</p>
    <div class="badges" style="grid-template-columns:repeat(3,1fr)">${[20,30,50,75,100,150].map(k=>`<button class="badge ${cur===k?'got':''}" style="padding:18px 8px" onclick="setChallenge(${k})"><div class="num" style="font-size:32px">${k}</div><div class="d">KM</div></button>`).join('')}</div>
    ${cur?`<button class="btn block" style="margin-top:14px" onclick="setChallenge(0)">Keluar dari cabaran</button>`:''}`); }
function setChallenge(k){ const mk=monthKey(); if(k) RC.data.challenges[mk]=k; else delete RC.data.challenges[mk]; RC.save(); closeSheet(); checkBadges(); renderClub(); if(k) toast('Cabaran '+k+' km disertai. Jom!'); }

/* ---------- PROFILE TAB ---------- */
function renderProfile(){
  const p=RC.data.profile, lk=lifetimeKm(), lv=levelOf(lk), all=RC.totals(0);
  $('view').innerHTML=`<div style="text-align:center;margin:10px 0 24px">
      <div class="avatar" style="width:92px;height:92px;font-size:38px;margin:0 auto;border-width:4px;--lvl:${lv.cur.c}">${esc(RC.displayName().charAt(0).toUpperCase())}</div>
      <div style="font-family:Oswald,sans-serif;font-size:30px;margin-top:12px;text-transform:uppercase">${esc(RC.displayName())}</div>
      <div class="muted" style="font-size:13px">${RC.userId?esc(RC.email||''):'Belum log masuk · data dalam telefon ini sahaja'}</div>
      <div class="pill" style="margin-top:10px;background:${lv.cur.c};color:#000">Level ${lv.cur.n}</div></div>
    <div class="stat3 card" style="margin-top:0;text-align:center"><div><div class="num">${fmtKm(all.dist,1)}</div><div class="l">KM jumlah</div></div>
      <div><div class="num">${all.n}</div><div class="l">Larian</div></div><div><div class="num">${fmtPace(paceOf(all.dur,all.dist))}</div><div class="l">Pace purata</div></div></div>
    ${RC.userId?'':`<button class="btn red block" style="margin-top:16px" onclick="openLogin()">Log masuk / Daftar</button>
      <p class="muted" style="font-size:12px;text-align:center;margin-top:8px">Akaun sama dengan app HITFAT. Backup larian & masuk leaderboard kelab.</p>`}
    <h2 class="sec">Tetapan</h2>
    <div class="card" style="padding:2px 16px">
      <div class="setrow"><div><div style="font-weight:700">Nama paparan</div><div class="muted" style="font-size:12px">Ditunjuk dalam leaderboard</div></div>
        <button class="pill" onclick="editName()">${esc(p.name||'Tetapkan')}</button></div>
      <div class="setrow"><div><div style="font-weight:700">Berat badan</div><div class="muted" style="font-size:12px">Untuk anggaran kalori</div></div>
        <button class="pill" onclick="editWeight()">${p.weightKg} kg</button></div>
      ${swRow('voice','Coach suara','Pengumuman suara semasa larian')}
      ${swRow('kmCues','Pengumuman setiap KM','Masa & pace setiap kilometer')}
      ${swRow('autoPause','Auto pause','Jeda sendiri bila kau berhenti')}
      <div class="setrow"><div><div style="font-weight:700">Uji suara</div><div class="muted" style="font-size:12px">${Voice.voice?esc(Voice.voice.name):'Suara Bahasa Melayu tak dijumpai, guna suara lalai'}</div></div>
        <button class="pill" onclick="Voice.unlock();Voice.say('Satu kilometer. Pace enam minit dua belas saat. Teruskan!', true)">🔊 Main</button></div>
    </div>
    <h2 class="sec">Lain-lain</h2>
    <div class="card" style="padding:2px 16px">
      <div class="setrow"><div style="font-weight:700">Eksport data (JSON)</div><button class="pill" onclick="exportData()">Muat turun</button></div>
      <div class="setrow"><div style="font-weight:700">App HITFAT Hybrid</div><a class="pill" href="/" style="text-decoration:none">Buka</a></div>
      ${RC.userId?`<div class="setrow"><div style="font-weight:700">Log keluar</div><button class="pill" onclick="signOut()">Log keluar</button></div>`:''}
    </div>
    <p class="muted" style="font-size:11px;text-align:center;margin:24px 0 0;line-height:1.5">Tip: biar skrin hidup dan app terbuka semasa larian.<br>Browser telefon hentikan GPS bila skrin dikunci.</p>`;
}
function swRow(k,t,d){ return `<div class="setrow"><div><div style="font-weight:700">${t}</div><div class="muted" style="font-size:12px">${d}</div></div>
  <label class="sw"><input type="checkbox" ${RC.data.profile[k]?'checked':''} onchange="RC.setProfile('${k}',this.checked)"><i></i></label></div>`; }
function editName(){ const v=prompt('Nama paparan (maks 40 huruf)', RC.data.profile.name||RC.displayName()); if(v===null) return;
  RC.setProfile('name', v.trim().slice(0,40)); renderProfile(); paintAvatar();
  if(RC.userId) Club.backfill(); }
function editWeight(){ const v=parseFloat(prompt('Berat badan (kg)', RC.data.profile.weightKg)); if(!(v>=25&&v<=250)) return; RC.setProfile('weightKg', Math.round(v)); renderProfile(); }
function exportData(){ const blob=new Blob([JSON.stringify(RC.data,null,1)],{ type:'application/json' }), a=document.createElement('a');
  a.href=URL.createObjectURL(blob); a.download='hitfat-run-'+new Date().toISOString().slice(0,10)+'.json'; a.click(); setTimeout(()=>URL.revokeObjectURL(a.href), 2000); }

/* ---------- sheet ---------- */
function openSheet(html){ $('sheet-body').innerHTML=html; $('sheet').classList.remove('hide'); }
function closeSheet(){ $('sheet').classList.add('hide'); $('sheet-body').innerHTML=''; }

/* ═══════════════ AUTH ═══════════════ */
let authSignup=false;
function openLogin(){ if(!sb){ toast('Log masuk tak tersedia (tiada internet).'); return; }
  openSheet(`<h3>${authSignup?'Daftar':'Log masuk'}</h3>
    <p class="muted" style="font-size:13px;margin-top:-4px">Akaun yang sama dengan app HITFAT.</p>
    <button class="btn white block" onclick="signInGoogle()"><svg width="18" height="18" viewBox="0 0 48 48"><path fill="#EA4335" d="M24 9.5c3.5 0 6.6 1.2 9 3.5l6.7-6.7C35.6 2.4 30.2 0 24 0 14.6 0 6.6 5.4 2.7 13.3l7.8 6C12.4 13.7 17.7 9.5 24 9.5z"/><path fill="#4285F4" d="M46.1 24.5c0-1.6-.1-3.1-.4-4.5H24v9h12.4c-.5 2.9-2.2 5.3-4.6 6.9l7.4 5.7c4.3-4 6.9-9.9 6.9-17.1z"/><path fill="#FBBC05" d="M10.5 28.7c-.5-1.4-.8-3-.8-4.7s.3-3.3.8-4.7l-7.8-6C1 16.6 0 20.2 0 24s1 7.4 2.7 10.7l7.8-6z"/><path fill="#34A853" d="M24 48c6.5 0 11.9-2.1 15.9-5.8l-7.4-5.7c-2.1 1.4-4.8 2.2-8.5 2.2-6.3 0-11.6-4.2-13.5-9.9l-7.8 6C6.6 42.6 14.6 48 24 48z"/></svg> Teruskan dengan Google</button>
    <div class="muted" style="text-align:center;font-size:12px;margin:14px 0 2px">atau dengan e-mel</div>
    <label>E-mel</label><input id="au-email" type="email" autocomplete="email" inputmode="email">
    <label>Kata laluan</label><input id="au-pass" type="password" autocomplete="${authSignup?'new-password':'current-password'}">
    <div class="msg" id="au-msg"></div>
    <button class="btn red block" style="margin-top:8px" onclick="emailAuth()">${authSignup?'Daftar':'Log masuk'}</button>
    <div style="text-align:center;font-size:13px;margin-top:14px" class="muted">${authSignup?'Dah ada akaun?':'Baru di sini?'} <a style="color:#fff;font-weight:700;cursor:pointer" onclick="authSignup=!authSignup;openLogin()">${authSignup?'Log masuk':'Daftar akaun'}</a></div>`); }
function authMsg(t,err){ const m=$('au-msg'); if(m){ m.textContent=t; m.className='msg'+(err?' err':''); } }
function redirectURL(){ return location.origin + '/run/'; }
function signInGoogle(){ authMsg('Membuka Google…'); sb.auth.signInWithOAuth({ provider:'google', options:{ redirectTo:redirectURL() } }).then(r=>{ if(r&&r.error) authMsg(r.error.message,true); }); }
async function emailAuth(){ const email=$('au-email').value.trim(), pass=$('au-pass').value;
  if(!email||!pass) return authMsg('Isi e-mel dan kata laluan.', true);
  authMsg('Sebentar…');
  if(authSignup){ const { data, error }=await sb.auth.signUp({ email, password:pass, options:{ emailRedirectTo:redirectURL() } });
    if(error) return authMsg(error.message,true); if(!data.session) return authMsg('Semak e-mel untuk sahkan akaun.'); }
  else { const { error }=await sb.auth.signInWithPassword({ email, password:pass }); if(error) return authMsg(error.message,true); }
}
async function signOut(){ if(!confirm('Log keluar? Larian dalam akaun kekal di cloud.')) return; await sb.auth.signOut(); }
async function onSignedIn(session){
  const u=session.user; if(RC.userId===u.id) return;
  const guest=RC.data;                         // runs logged before signing in come along
  RC.userId=u.id; RC.email=u.email; RC.meta=u.user_metadata||{};
  RC.load(); if(guest && guest.runs.length){ RC.merge(guest); try{ localStorage.removeItem(RC.KEY); }catch(e){} }
  closeSheet(); await RC.pull(); RC.save(); Club.backfill(); checkBadges(); go(curTab);
}
function onSignedOut(){ RC.userId=null; RC.email=null; RC.meta=null; RC.load(); go(curTab); }

/* ═══════════════ SHARE CARD ═══════════════ */
async function shareRun(id){ const r=RC.getRun(id); if(!r) return;
  try{ await document.fonts.load('700 100px Oswald'); }catch(e){}
  const W=1080, H=1350, c=document.createElement('canvas'); c.width=W; c.height=H; const x=c.getContext('2d');
  x.fillStyle='#000'; x.fillRect(0,0,W,H);
  const grad=x.createLinearGradient(0,0,0,H); grad.addColorStop(0,'rgba(217,44,26,.35)'); grad.addColorStop(.6,'rgba(0,0,0,0)'); x.fillStyle=grad; x.fillRect(0,0,W,H);
  if(r.route&&r.route.length>1){ const lat0=r.route[0][0]*Math.PI/180, k=Math.cos(lat0); const xs=r.route.map(p=>p[1]*k), ys=r.route.map(p=>-p[0]);
    const minX=Math.min(...xs), maxX=Math.max(...xs), minY=Math.min(...ys), maxY=Math.max(...ys), box=640, span=Math.max(maxX-minX,maxY-minY)||1e-6, s=box/span;
    const ox=(W-(maxX-minX)*s)/2, oy=110+(box-(maxY-minY)*s)/2;
    x.strokeStyle='#F0392B'; x.lineWidth=14; x.lineJoin='round'; x.lineCap='round'; x.beginPath();
    xs.forEach((v,i)=>{ const px=(v-minX)*s+ox, py=(ys[i]-minY)*s+oy; i?x.lineTo(px,py):x.moveTo(px,py); }); x.stroke(); }
  x.fillStyle='#fff'; x.textAlign='left';
  x.font='700 240px Oswald, Impact, sans-serif'; x.fillText(fmtKm(r.dist), 80, 1010);
  x.font='600 44px Oswald, sans-serif'; x.fillStyle='#bbb'; x.fillText('KILOMETER', 88, 1070);
  x.fillStyle='#fff'; x.font='700 70px Oswald, sans-serif';
  x.fillText(fmtPace(paceOf(r.dur,r.dist)), 80, 1190); x.fillText(fmtDur(r.dur), 500, 1190);
  x.font='600 30px Inter, sans-serif'; x.fillStyle='#9a9a9a'; x.fillText('PACE', 84, 1235); x.fillText('MASA', 504, 1235);
  x.font='700 40px Oswald, sans-serif'; x.fillStyle='#fff'; x.fillText('HITFAT', 80, 90); x.fillStyle='#F0392B'; x.fillText('RUN', 80+x.measureText('HITFAT ').width, 90);
  x.fillStyle='#fff'; x.fillText('CLUB', 80+x.measureText('HITFAT RUN ').width, 90);
  x.textAlign='right'; x.font='500 30px Inter, sans-serif'; x.fillStyle='#9a9a9a'; x.fillText(fmtDate(r.start), W-80, 88);
  c.toBlob(async blob=>{ const file=new File([blob], 'hitfat-run.png', { type:'image/png' });
    if(navigator.canShare && navigator.canShare({ files:[file] })){ try{ await navigator.share({ files:[file], text:fmtKm(r.dist)+' km dengan HITFAT RUN CLUB 🏃' }); }catch(e){} }
    else { const a=document.createElement('a'); a.href=URL.createObjectURL(blob); a.download='hitfat-run.png'; a.click(); toast('Gambar dimuat turun'); } }, 'image/png'); }

/* ═══════════════ BOOT ═══════════════ */
function boot(){
  Voice.init(); RC.load();
  const t=(location.hash||'').slice(1); go(['run','guided','activity','club','profile'].includes(t)?t:'run');
  if(sb){
    sb.auth.getSession().then(({ data })=>{ if(data && data.session) onSignedIn(data.session); }).catch(()=>{});
    sb.auth.onAuthStateChange((ev, session)=>{ if(session) onSignedIn(session); else if(ev==='SIGNED_OUT') onSignedOut(); });
  }
  window.addEventListener('beforeunload', e=>{ if(Live.st && Live.st.status!=='countdown'){ Live.persist(); e.preventDefault(); e.returnValue=''; } });
}
window.addEventListener('error', e=>console.error('JS error', e.message, e.lineno));
if(document.readyState==='loading') document.addEventListener('DOMContentLoaded', boot); else boot();
</script>
