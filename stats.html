<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="robots" content="noindex,nofollow">
<title>HITFAT — Analytics</title>
<link rel="icon" href="favicon-32.png">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<style>
  :root{--bg:#000;--surface:#0e0e0e;--surface2:#161616;--line:#262626;--dim:#9a9a9a;--dim2:#6a6a6a;--hitfat:#FFE000;}
  *{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent;}
  body{background:var(--bg);color:#fff;font-family:'Inter',system-ui,sans-serif;padding:20px 16px 60px;max-width:900px;margin:0 auto;}
  h1{font-size:24px;font-weight:800;letter-spacing:-.5px;}
  h1 .y{color:var(--hitfat);}
  .sub{color:var(--dim);font-size:13px;margin-top:4px;}
  .sechead{font-size:17px;font-weight:800;letter-spacing:-.3px;margin:30px 0 11px;}
  .card{background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:16px;}
  .msg{background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:22px;margin-top:20px;line-height:1.55;}
  .msg b{color:var(--hitfat);}
  .msg code{background:#000;border:1px solid var(--line);border-radius:6px;padding:2px 6px;font-size:12.5px;color:#ffe97a;}
  a{color:var(--hitfat);}
  .range{display:flex;gap:8px;margin-top:14px;}
  .range button{flex:none;background:var(--surface);border:1px solid var(--line);color:#fff;border-radius:99px;padding:7px 15px;font:inherit;font-size:13px;font-weight:600;cursor:pointer;}
  .range button.on{background:var(--hitfat);color:#141000;border-color:var(--hitfat);}
  .tiles{display:grid;grid-template-columns:repeat(auto-fit,minmax(140px,1fr));gap:11px;}
  .tile{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:14px 15px;}
  .tile .n{font-size:26px;font-weight:800;letter-spacing:-.8px;}
  .tile .l{color:var(--dim);font-size:12px;font-weight:500;margin-top:2px;}
  .bars{display:flex;align-items:flex-end;gap:3px;height:130px;margin-top:4px;}
  .bars .b{flex:1;min-width:3px;background:linear-gradient(180deg,var(--hitfat),#6e6000);border-radius:3px 3px 0 0;position:relative;}
  .bars .b:hover{filter:brightness(1.25);}
  .axis{display:flex;justify-content:space-between;color:var(--dim2);font-size:11px;margin-top:7px;}
  .frow{margin-bottom:12px;}
  .frow .ft{display:flex;justify-content:space-between;font-size:13.5px;font-weight:600;margin-bottom:5px;}
  .frow .ft span:last-child{color:var(--dim);font-weight:500;}
  .track{height:9px;background:#1c1c1c;border-radius:99px;overflow:hidden;}
  .track i{display:block;height:100%;background:var(--hitfat);border-radius:99px;}
  table{width:100%;border-collapse:collapse;font-size:13.5px;}
  th{text-align:left;color:var(--dim2);font-weight:600;font-size:11.5px;text-transform:uppercase;letter-spacing:.5px;padding:0 8px 8px 0;}
  td{padding:9px 8px 9px 0;border-top:1px solid var(--line);}
  td.n,th.n{text-align:right;padding-right:0;font-variant-numeric:tabular-nums;}
  .empty{color:var(--dim);font-size:13.5px;padding:6px 0;}
  .foot{color:var(--dim2);font-size:11.5px;margin-top:34px;line-height:1.6;}
</style>
</head>
<body>

<h1>HITFAT <span class="y">ANALYTICS</span></h1>
<div class="sub" id="sub">Loading…</div>
<div class="range" id="range" style="display:none;">
  <button data-d="7">7 days</button><button data-d="30" class="on">30 days</button><button data-d="90">90 days</button>
</div>

<div id="out"></div>

<script>
const SUPA_URL='https://auth.hitfat.io';
const SUPA_KEY='sb_publishable_6tKH033Hb74EV7QlKBCFFA_5K_Lsxgv';
// Same origin as the app, so supabase-js finds the session the app already stored —
// there is deliberately no second login screen here.
const sb=window.supabase.createClient(SUPA_URL,SUPA_KEY);
const $=id=>document.getElementById(id);
const esc=s=>String(s==null?'':s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
let days=30;

function msg(html){ $('out').innerHTML='<div class="msg">'+html+'</div>'; }

async function load(){
  $('sub').textContent='Loading…';
  const { data:{ session } } = await sb.auth.getSession();
  if(!session){
    $('sub').textContent='Not signed in';
    return msg('You are not signed in on this browser.<br><br>Open <a href="/">the app</a>, sign in as normal, then come back to this page — it reuses that same session.');
  }
  let r,d;
  try{
    r=await fetch('/.netlify/functions/stats?days='+days,{ headers:{ Authorization:'Bearer '+session.access_token } });
    d=await r.json();
  }catch(e){ $('sub').textContent='Error'; return msg('Could not reach the stats function.<br><br><code>'+esc(String(e))+'</code>'); }

  if(r.status===403) { $('sub').textContent='Access denied';
    return msg('Signed in as <b>'+esc(session.user.email)+'</b>, but that address is not an admin.<br><br>Add it to the <code>ADMIN_EMAILS</code> environment variable in Netlify (Site settings → Environment variables), then redeploy.'); }
  if(d && d.error==='no_admins_configured'){ $('sub').textContent='Not configured';
    return msg('<code>ADMIN_EMAILS</code> is not set in Netlify, so the endpoint is denying everyone by design.<br><br>Set it to <code>'+esc(session.user.email)+'</code> in Site settings → Environment variables, then redeploy.'); }
  if(!r.ok || !d || !d.ok){ $('sub').textContent='Error';
    return msg('The stats function returned an error.<br><br><code>'+esc((d&&(d.detail||d.error))||r.status)+'</code>'); }

  render(d, session.user.email);
}

function render(d, email){
  $('range').style.display='flex';
  $('sub').textContent=email+' · last '+d.days+' days · '+d.totals.events.toLocaleString()+' events';
  const t=d.totals;
  let h='';

  // ---- money first: it is the number that actually matters ----
  const s=d.sales||{}, c=d.customers||{};
  h+='<div class="sechead">Sales</div>'
   + '<div class="tiles">'
   + tile('RM '+fmt(s.revenue_total),'Revenue (all time)')
   + tile(s.orders_total,'Paid orders')
   + tile('RM '+fmt(s.revenue_window),'Revenue (last '+d.days+' days)')
   + tile('RM '+fmt(s.avg_order),'Average order')
   + '</div>';

  if(s.pending){
    h+='<div class="card" style="margin-top:11px;">'
     + '<b>'+s.pending+'</b> unpaid checkout'+(s.pending===1?'':'s')
     + (s.stale_pending? ' — <b style="color:#FF9500">'+s.stale_pending+' older than a day</b>. Those are either buyers who walked away, or a Bayarcash callback that never landed; open the order in Bayarcash to tell which.' : ' still in progress.')
     + '</div>';
  }

  h+=table('Revenue by program', s.by_program, ['Program','Orders','Revenue'],
        r=>[esc(r.id), r.orders, 'RM '+fmt(r.revenue)]);
  h+=table('Recent orders', s.recent, ['When','Program','Amount','Status'],
        r=>[esc(r.when||'—'), esc(r.program), 'RM '+fmt(r.amount),
            '<span style="color:'+(r.status==='paid'?'#2ec27e':'#9a9a9a')+'">'+esc(r.status)+'</span>']);

  h+='<div class="sechead">Customers</div>'
   + '<div class="tiles">'
   + tile(c.total,'Signed up') + tile(c.paying,'Have paid')
   + tile((c.total?Math.round((c.paying/c.total)*100):0)+'%','Convert to paid')
   + tile('RM '+fmt(c.paying? (s.revenue_total/c.paying):0),'Revenue per paying customer')
   + '</div>';
  h+=table('', c.list, ['Customer','Joined','Last seen','Orders','Spent'],
        r=>[esc(r.email)+(r.programs&&r.programs.length?'<div style="color:#6a6a6a;font-size:11.5px;margin-top:2px;">'+esc(r.programs.join(', '))+'</div>':''),
            esc(r.joined||'—'), esc(r.last_seen||'—'), r.orders, r.spent?'RM '+fmt(r.spent):'—']);

  h+='<div class="sechead">Traffic</div>';
  h+='<div class="tiles">'
   + tile(t.sessions,'Sessions') + tile(t.signed_in_users,'Signed-in users')
   + tile(t.signin_attempts,'Sign-in attempts') + tile(t.blocked_checkouts,'Checkouts blocked by sign-in')
   + '</div>';

  // daily
  h+='<div class="sechead">Sessions per day</div><div class="card">';
  if(!d.daily.length) h+='<div class="empty">No activity yet.</div>';
  else{
    const max=Math.max.apply(null,d.daily.map(x=>x.sessions))||1;
    h+='<div class="bars">'+d.daily.map(x=>'<div class="b" style="height:'+Math.max(3,Math.round(x.sessions/max*100))+'%" title="'+x.day+' — '+x.sessions+' sessions, '+x.users+' signed in"></div>').join('')+'</div>'
     + '<div class="axis"><span>'+d.daily[0].day+'</span><span>peak '+max+'</span><span>'+d.daily[d.daily.length-1].day+'</span></div>';
  }
  h+='</div>';

  // funnel
  const LBL={app_open:'Opened the app',program_view:'Viewed a program',checkout_start:'Started checkout',program_unlocked:'Unlocked (paid)'};
  const top=(d.funnel[0]&&d.funnel[0].sessions)||0;
  h+='<div class="sechead">Funnel</div><div class="card">';
  if(!top) h+='<div class="empty">No sessions in this window yet.</div>';
  else h+=d.funnel.map(f=>{
    const pct=top?Math.round(f.sessions/top*100):0;
    return '<div class="frow"><div class="ft"><span>'+LBL[f.step]+'</span><span>'+f.sessions+' sessions · '+pct+'%</span></div>'
         + '<div class="track"><i style="width:'+pct+'%"></i></div></div>';
  }).join('');
  h+='</div>';

  h+=table('Programs', d.programs, ['Program','Views','Checkouts','Bought'],
        r=>[esc(r.id), r.views, r.checkouts, r.unlocked]);
  h+=table('Quick Workouts opened', d.quick_workouts, ['Workout','Opens'], r=>[esc(r.key), r.count]);
  h+=table('Tabs used', d.tabs, ['Tab','Views'], r=>[esc(r.key), r.count]);
  h+=table('Traffic sources', d.referrers, ['Source','Sessions'], r=>[esc(r.key), r.count]);

  h+='<div class="foot">Generated '+esc(d.generated_at.replace('T',' ').slice(0,16))+' UTC.'
   + (d.truncated?' <b>Window truncated at 50,000 events</b> — narrow the range for exact numbers.':'')
   + '<br>Revenue comes from the payments table — only rows the Bayarcash callback verified as paid are counted, so nothing here is inflated by abandoned checkouts. Traffic counts are by browser session, so one person returning tomorrow counts twice.'
   + '<br>This page shows customer email addresses. Nobody but an admin can load it, and the events table is write-only from the browser.</div>';

  $('out').innerHTML=h;
}

function fmt(n){ return Number(n||0).toLocaleString('en-MY',{minimumFractionDigits:2,maximumFractionDigits:2}); }
function tile(n,l){
  const v = typeof n==='number' ? Number(n||0).toLocaleString() : (n==null?'0':String(n));
  return '<div class="tile"><div class="n">'+v+'</div><div class="l">'+l+'</div></div>';
}
function table(title,rows,heads,fn){
  let h=(title?'<div class="sechead">'+title+'</div>':'<div style="height:11px"></div>')+'<div class="card">';
  if(!rows||!rows.length) h+='<div class="empty">Nothing recorded yet.</div>';
  else h+='<table><tr>'+heads.map((x,i)=>'<th'+(i?' class="n"':'')+'>'+x+'</th>').join('')+'</tr>'
        + rows.slice(0,25).map(r=>'<tr>'+fn(r).map((c,i)=>'<td'+(i?' class="n"':'')+'>'+c+'</td>').join('')+'</tr>').join('')
        + '</table>';
  return h+'</div>';
}

$('range').addEventListener('click',e=>{
  const b=e.target.closest('button'); if(!b) return;
  days=parseInt(b.dataset.d,10);
  [].forEach.call($('range').children,x=>x.classList.toggle('on',x===b));
  load();
});
load();
</script>
</body>
</html>
