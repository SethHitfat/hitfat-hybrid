[build]
  publish = "."
  command = ""

# Always revalidate the app HTML/manifest so users get updates immediately
# (fixes iOS Safari / PWA serving a stale cached version).
[[headers]]
  for = "/"
  [headers.values]
    Cache-Control = "public, max-age=0, must-revalidate"

[[headers]]
  for = "/index.html"
  [headers.values]
    Cache-Control = "public, max-age=0, must-revalidate"

[[headers]]
  for = "/manifest.json"
  [headers.values]
    Cache-Control = "public, max-age=0, must-revalidate"
