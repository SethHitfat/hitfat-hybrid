[build]
  publish = "."
  command = ""

# Serverless functions (Strava OAuth token exchange/refresh — keep Client Secret server-side)
[functions]
  directory = "netlify/functions"

# Always revalidate the app HTML/manifest so users get updates immediately
# (fixes iOS Safari / PWA serving a stale cached version).
[[headers]]
  for = "/"
  [headers.values]
    Cache-Control = "public, max-age=0, must-revalidate"

[[headers]]
  for = "/index.html"
  [headers.values]
    Cache-Control = "public, max-age=0, must-revalidate"

[[headers]]
  for = "/manifest.json"
  [headers.values]
    Cache-Control = "public, max-age=0, must-revalidate"

[[headers]]
  for = "/lab.html"
  [headers.values]
    Cache-Control = "public, max-age=0, must-revalidate"

# clean shareable URL for the Rep Lab tool
[[redirects]]
  from = "/lab"
  to = "/lab.html"
  status = 200

# the Google OAuth consent screen requires these to be reachable at clean URLs
[[redirects]]
  from = "/privacy"
  to = "/privacy.html"
  status = 200

[[redirects]]
  from = "/terms"
  to = "/terms.html"
  status = 200
