<!DOCTYPE html>
<html lang="en"><head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>HITFAT Club · Coach</title>
<meta name="theme-color" content="#000000">
<link rel="icon" href="favicon-32.png">
<link href="https://fonts.googleapis.com/css2?family=Oswald:wght@500;700&family=Inter:wght@400;600;700&display=swap" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="qr.js"></script>
<style>
  :root{ --bg:#0b0b0b; --surface:#141414; --line:#262626; --dim:#8a8a8a; --dim2:#5f5f5f; --hyrox:#FFE000; --ink:#111; }
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent;}
  body{margin:0;background:var(--bg);color:#fff;font-family:'Inter',system-ui,sans-serif;font-size:15px;}
  .wrap{max-width:760px;margin:0 auto;padding:18px 16px 60px;}
  h1{font-family:'Oswald';font-size:26px;letter-spacing:.5px;margin:0 0 2px;text-transform:uppercase;}
  h1 span{color:var(--hyrox);}
  .sub{color:var(--dim);font-size:13px;margin-bottom:18px;}
  h2{font-family:'Oswald';font-size:15px;letter-spacing:2px;text-transform:uppercase;color:var(--dim);margin:26px 0 10px;}
  .card{background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:15px;margin-bottom:10px;}
  .row{display:flex;align-items:center;gap:10px;}
  .row .g{flex:1;min-width:0;}
  .t{font-weight:700;font-size:15px;}
  .m{color:var(--dim);font-size:12.5px;margin-top:2px;}
  button{font:inherit;cursor:pointer;border-radius:99px;border:1px solid var(--line);background:#1c1c1c;color:#fff;padding:10px 15px;font-weight:600;font-size:13.5px;}
  button.p{background:var(--hyrox);color:var(--ink);border-color:transparent;font-family:'Oswald';letter-spacing:1.2px;text-transform:uppercase;font-weight:700;}
  button.sm{padding:7px 11px;font-size:12px;}
  button.dg{color:#ff6b6b;}
  button:disabled{opacity:.5;cursor:default;}
  input,select,textarea{width:100%;background:#101010;border:1px solid var(--line);border-radius:12px;padding:11px 13px;color:#fff;font:inherit;font-size:14px;}
  label{display:block;font-size:11px;letter-spacing:1px;text-transform:uppercase;color:var(--dim);margin:10px 0 5px;}
  .grid2{display:grid;grid-template-columns:1fr 1fr;gap:10px;}
  .tabs{display:flex;gap:7px;overflow-x:auto;margin:4px 0 16px;scrollbar-width:none;}
  .tabs::-webkit-scrollbar{display:none;}
  .tabs button{white-space:nowrap;}
  .tabs button.on{background:var(--hyrox);color:var(--ink);border-color:transparent;font-weight:700;}
  .codewrap{display:flex;align-items:center;justify-content:center;gap:22px;flex-wrap:wrap;margin-bottom:6px;}
  .codewrap canvas{background:#fff;border-radius:12px;padding:6px;width:220px;height:220px;image-rendering:pixelated;}
  .code{font-family:'Oswald';font-size:64px;letter-spacing:14px;text-align:center;color:var(--hyrox);margin:6px 0 2px;padding-left:14px;}
  .codesub{text-align:center;color:var(--dim);font-size:12px;margin-bottom:10px;}
  .pill{display:inline-block;font-size:10px;font-weight:700;letter-spacing:1px;text-transform:uppercase;padding:3px 8px;border-radius:99px;border:1px solid var(--line);color:var(--dim);}
  .pill.warn{color:#ffb599;border-color:rgba(255,107,53,.45);}
  .pill.ok{color:#2ec27e;border-color:rgba(46,194,126,.4);}
  .note{color:var(--dim2);font-size:12px;line-height:1.5;margin-top:8px;}
  .toast{position:fixed;left:50%;bottom:22px;transform:translateX(-50%) translateY(20px);background:#1c1c1c;border:1px solid var(--line);border-radius:99px;padding:11px 18px;font-size:13.5px;opacity:0;transition:.2s;pointer-events:none;}
  .toast.on{opacity:1;transform:translateX(-50%) translateY(0);}
</style>
</head><body>
<div class="wrap">
  <h1>HITFAT <span>CLUB</span></h1>
  <div class="sub" id="who">Coach & admin</div>
  <div id="app"></div>
</div>
<div class="toast" id="toast"></div>
<script>
/* ============================================================
   HITFAT Club — coach and admin console

   Deliberately a separate page. The member app is already 700KB and nobody
   training should download the console; a mistake here also cannot take the
   training app down with it.

   It holds no privileges of its own: every action goes through the same RLS
   and the same SECURITY DEFINER functions as the app, so a member who opens
   this page can see nothing a member could not already see.
   ============================================================ */
const SUPA_URL = 'https://auth.hitfat.io';
const SUPA_KEY = 'sb_publishable_6tKH033Hb74EV7QlKBCFFA_5K_Lsxgv';   // publishable key — public by design
const sb = window.supabase.createClient(SUPA_URL, SUPA_KEY);
const $ = id => document.getElementById(id);
const esc = s => String(s==null?'':s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
let me=null, staff=null, tab='today', codeTimer=null, curSession=null, isHitfat=false;

function toast(msg){ const t=$('toast'); t.textContent=msg; t.classList.add('on'); clearTimeout(window._t); window._t=setTimeout(()=>t.classList.remove('on'),2200); }
async function q(fn){ try{ const r=await fn(); if(r&&r.error){ console.warn(r.error); toast(r.error.message||'Request failed'); return null; } return r?r.data:null; }catch(e){ console.warn(e); return null; } }
function fmtTime(iso){ const d=new Date(iso); let h=d.getHours(); const m=d.getMinutes(); const ap=h>=12?'PM':'AM'; h=h%12||12; return h+':'+(m<10?'0':'')+m+' '+ap; }
function fmtDay(iso){ const d=new Date(iso); return d.toDateString().slice(0,10); }
const BENCH_LABEL = {run_1k:'1KM', run_5k:'5KM', ski_1000:'Ski 1000', full_sim:'Full Sim'};
function fmtSecs(sec){
  sec=Math.round(Number(sec)||0);
  const h=Math.floor(sec/3600), m=Math.floor((sec%3600)/60), s=sec%60, pad=n=>(n<10?'0':'')+n;
  return h ? h+':'+pad(m)+':'+pad(s) : m+':'+pad(s);
}
function daysAgo(iso){ if(!iso) return null; return Math.floor((Date.now()-new Date(iso).getTime())/864e5); }

/* ---------- auth ---------- */
function signInView(msg){
  $('app').innerHTML = `<div class="card">
    <div class="t">Sign in</div>
    <div class="m">Use the same HITFAT Hybrid account a coach role was granted to.</div>
    ${msg?`<div class="note" style="color:#ff9a8a;">${esc(msg)}</div>`:''}
    <label>Email</label><input id="em" type="email" autocomplete="username">
    <label>Password</label><input id="pw" type="password" autocomplete="current-password">
    <button class="p" style="width:100%;margin-top:14px;" onclick="doSignIn()">Sign in</button>
    <div class="note">Members do not need this page. Everything here is also protected by row level security — signing in as a member shows nothing extra.</div>
  </div>`;
}
async function doSignIn(){
  const email=$('em').value.trim(), password=$('pw').value;
  if(!email||!password) return toast('Email and password');
  const { error } = await sb.auth.signInWithPassword({ email, password });
  if(error) return signInView(error.message);
  boot();
}
async function signOut(){ await sb.auth.signOut(); location.reload(); }

async function boot(){
  const { data:{ session } } = await sb.auth.getSession();
  if(!session){ signInView(); return; }
  me = session.user;
  const rows = await q(()=> sb.from('club_physical_members').select('*').eq('user_id', me.id));
  staff = (rows||[]).filter(r=> r.status==='active' && (r.role==='coach'||r.role==='admin'))[0] || null;
  if(!staff){
    $('who').textContent = me.email || '';
    $('app').innerHTML = `<div class="card"><div class="t">Not a coach account</div>
      <div class="m">This account has no active coach or admin role in a club, so there is nothing to manage here.</div>
      <div class="note">The first admin is granted once in the SQL editor — see the bottom of hitfat-club.sql.</div>
      <button style="margin-top:12px;" onclick="signOut()">Sign out</button></div>`;
    return;
  }
  // only HITFAT itself reviews who joins the network
  const hq = await q(()=> sb.rpc('hitfat_is_admin'));
  isHitfat = hq === true;
  const club = await q(()=> sb.from('club_list').select('name').eq('id', staff.club_id).maybeSingle());
  $('who').innerHTML = esc((club&&club.name)||'Club') + ' · ' + esc(staff.role) + ' · ' + esc(me.email||'')
    + ' <button class="sm" style="margin-left:8px;" onclick="signOut()">Sign out</button>';
  render();
}

function render(){
  const t=(k,l)=>`<button class="${tab===k?'on':''}" onclick="setTab('${k}')">${l}</button>`;
  $('app').innerHTML = `<div class="tabs">${t('today','Today')}${t('sessions','Sessions')}${t('members','Members')}${t('news','Announcements')}${isHitfat?t('partners','Partners'):''}</div><div id="body"></div>`;
  if(tab==='today') viewToday();
  else if(tab==='sessions') viewSessions();
  else if(tab==='members') viewMembers();
  else if(tab==='partners') viewPartners();
  else viewNews();
}
function setTab(k){ if(codeTimer){ clearInterval(codeTimer); codeTimer=null; } tab=k; render(); }

/* ---------- today + the rotating code ---------- */
async function viewToday(){
  const from=new Date(); from.setHours(0,0,0,0);
  const to=new Date();   to.setHours(23,59,59,0);
  const rows = await q(()=> sb.from('club_schedule').select('*').eq('club_id',staff.club_id)
      .gte('starts_at',from.toISOString()).lte('starts_at',to.toISOString()).order('starts_at')) || [];
  if(!rows.length){
    $('body').innerHTML = `<div class="card"><div class="t">No sessions today</div>
      <div class="m">Create one under Sessions, then come back here to run the check-in.</div></div>`;
    return;
  }
  $('body').innerHTML = rows.map(s=>`<div class="card">
      <div class="row"><div class="g"><div class="t">${esc(s.title)}</div>
        <div class="m">${fmtTime(s.starts_at)} · ${esc(s.coach_name||'')} · ${s.checked_in||0} checked in</div></div>
      <button class="p sm" onclick="openRun('${s.id}')">Run check-in</button></div>
    </div>`).join('') + `<div id="run"></div>`;
}
async function openRun(id){
  curSession = id;
  $('run').innerHTML = `<div class="card">
    <div class="codewrap">
      <canvas id="theqr" width="260" height="260"></canvas>
      <div>
        <div class="code" id="thecode">------</div>
        <div class="codesub" id="codesub">generating…</div>
      </div>
    </div>
    <div class="row" style="justify-content:center;gap:8px;">
      <button class="sm" onclick="rotate()">New code now</button>
      <button class="sm" onclick="loadCheckedIn()">Refresh list</button>
    </div>
    <div class="note">Show this screen at the door. Both halves are the same code: scan the square, or type the letters. It changes every 45 seconds, so a photograph of it is worthless a minute later.</div>
  </div>
  <h2>Checked in</h2><div id="inlist" class="card"><div class="m">Loading…</div></div>`;
  await rotate();
  await loadCheckedIn();
  if(codeTimer) clearInterval(codeTimer);
  codeTimer = setInterval(async ()=>{ if(!document.getElementById('thecode')){ clearInterval(codeTimer); codeTimer=null; return; } await rotate(); await loadCheckedIn(); }, 40000);
}
async function rotate(){
  const r = await q(()=> sb.rpc('club_rotate_code', { p_session: curSession, p_seconds: 45 }));
  const row = Array.isArray(r) ? r[0] : r;
  if(!row){ $('codesub').textContent='could not generate a code'; return; }
  $('thecode').textContent = row.code;
  $('codesub').textContent = 'valid until ' + fmtTime(row.expires_at) + ' · changes automatically';
  try{ if(window.HFQR) HFQR.toCanvas(row.code, 260, $('theqr')); }
  catch(e){ console.warn('qr', e); const c=$('theqr'); if(c) c.style.display='none'; }   // the letters alone still work
}
async function loadCheckedIn(){
  const rows = await q(()=> sb.from('club_attendance').select('user_id,checked_in_at,method')
      .eq('session_id', curSession).order('checked_in_at',{ascending:false})) || [];
  if(!rows.length){ $('inlist').innerHTML = '<div class="m">Nobody yet.</div>'; return; }
  const names = await namesFor(rows.map(r=>r.user_id));
  /* The coach is standing in the room, so the coach is the last word on who is
     actually in it — one tap removes a check-in that should not be there. */
  $('inlist').innerHTML = rows.map(r=>`<div class="row" style="padding:6px 0;">
      <div class="g"><div class="t">${esc(names[r.user_id]||'Athlete')}</div>
      <div class="m">${fmtTime(r.checked_in_at)}${r.method==='coach'?' · marked by coach':''}</div></div>
      <button class="sm dg" onclick="removeCheckIn('${r.user_id}','${esc(names[r.user_id]||'this athlete')}')">Remove</button></div>`).join('');
}
async function removeCheckIn(userId, name){
  if(!curSession) return;
  if(!confirm('Remove '+name+' from this session?')) return;
  const r = await sb.from('club_attendance').delete().eq('session_id', curSession).eq('user_id', userId);
  if(r.error) return toast(r.error.message);
  toast('Removed'); loadCheckedIn();
}
async function namesFor(ids){
  const uniq=[...new Set(ids)]; if(!uniq.length) return {};
  const rows = await q(()=> sb.from('profiles').select('id,name,display_name,username').in('id', uniq)) || [];
  const out={}; rows.forEach(p=>{ out[p.id]= p.display_name || p.name || (p.username?('@'+p.username):'Athlete'); });
  return out;
}

/* ---------- sessions ---------- */
async function viewSessions(){
  const rows = await q(()=> sb.from('club_schedule').select('*').eq('club_id',staff.club_id)
      .gte('starts_at', new Date(Date.now()-864e5).toISOString()).order('starts_at').limit(60)) || [];
  const d=new Date(); const day=d.toISOString().slice(0,10);
  $('body').innerHTML = `<div class="card">
      <div class="t">New session</div>
      <label>Title</label><input id="s-title" placeholder="Hybrid Engine">
      <div class="grid2"><div><label>Date</label><input id="s-date" type="date" value="${day}"></div>
        <div><label>Time</label><input id="s-time" type="time" value="17:30"></div></div>
      <div class="grid2"><div><label>Duration (min)</label><input id="s-dur" type="number" value="60"></div>
        <div><label>Coach</label><input id="s-coach" placeholder="Coach Dhil"></div></div>
      <label>Location</label><input id="s-loc" placeholder="HITFAT Studio">
      <label>Focus (optional)</label><input id="s-focus" placeholder="Compromised running + sled">
      <button class="p" style="width:100%;margin-top:14px;" onclick="createSession()">Create session</button>
    </div>
    <h2>Upcoming</h2>
    ${rows.length ? rows.map(s=>`<div class="card"><div class="row">
        <div class="g"><div class="t">${esc(s.title)} ${s.status!=='scheduled'?`<span class="pill">${esc(s.status)}</span>`:''}</div>
          <div class="m">${fmtDay(s.starts_at)} · ${fmtTime(s.starts_at)} · ${s.checked_in||0} checked in</div></div>
        <button class="sm dg" onclick="delSession('${s.id}')">Delete</button></div></div>`).join('')
      : '<div class="card"><div class="m">Nothing scheduled.</div></div>'}`;
}
async function createSession(){
  const title=$('s-title').value.trim();
  if(!title) return toast('Give the session a title');
  const starts = new Date($('s-date').value+'T'+($('s-time').value||'17:30')+':00');
  if(isNaN(starts)) return toast('Check the date and time');
  const r = await q(()=> sb.from('club_sessions').insert({
    club_id: staff.club_id, title, coach_name:$('s-coach').value.trim()||null,
    location:$('s-loc').value.trim()||null, focus:$('s-focus').value.trim()||null,
    starts_at: starts.toISOString(), duration_min: parseInt($('s-dur').value||'60',10) || 60,
    created_by: me.id
  // returning only granted columns: check_code is deliberately unreadable, and a
  // bare .select() would ask for it and get the whole insert refused
  }).select('id,title,starts_at'));
  if(!r) return;
  toast('Session created ✓'); viewSessions();
}
async function delSession(id){
  if(!confirm('Delete this session and its attendance?')) return;
  const r = await sb.from('club_sessions').delete().eq('id', id);
  if(r.error) return toast(r.error.message);
  toast('Deleted'); viewSessions();
}

/* ---------- members ---------- */
async function viewMembers(){
  const members = await q(()=> sb.from('club_physical_members').select('*').eq('club_id',staff.club_id).order('created_at')) || [];
  const names = await namesFor(members.map(m=>m.user_id));
  const att = await q(()=> sb.from('club_attendance').select('user_id,checked_in_at').eq('club_id',staff.club_id).order('checked_in_at',{ascending:false}).limit(2000)) || [];
  /* one query for everyone's benchmarks, best time per test — the policy on
     club_performance already limits this to athletes in a club you staff */
  const perf = members.length
    ? (await q(()=> sb.from('club_performance').select('user_id,metric,seconds')
        .in('user_id', members.map(m=>m.user_id)).limit(2000)) || [])
    : [];
  const best = {};
  perf.forEach(p=>{ const k=p.user_id+'|'+p.metric; if(!(k in best) || p.seconds<best[k]) best[k]=p.seconds; });
  const benchLine = uid => {
    const bits = Object.keys(BENCH_LABEL)
      .filter(m => (uid+'|'+m) in best)
      .map(m => BENCH_LABEL[m]+' '+fmtSecs(best[uid+'|'+m]));
    return bits.length ? `<div class="m">${bits.join(' · ')}</div>` : '';
  };
  const last={}, total={};
  att.forEach(a=>{ if(!last[a.user_id]) last[a.user_id]=a.checked_in_at; total[a.user_id]=(total[a.user_id]||0)+1; });
  $('body').innerHTML = `<div class="card">
      <div class="t">Add a member</div>
      <div class="m">Search an athlete by the name on their HITFAT Hybrid profile.</div>
      <input id="q-name" placeholder="Name or username" oninput="searchAthletes()">
      <div id="q-res"></div>
      <div class="note">Email is not searchable on purpose: the app keeps addresses unreadable to every client, including this one.</div>
    </div>
    <h2>${members.length} member${members.length===1?'':'s'}</h2>
    ${members.map(m=>{
      const d=daysAgo(last[m.user_id]);
      const flag = (m.status==='active' && (d===null || d>=10))
        ? `<span class="pill warn">${d===null?'never trained':'no training for '+d+' days'}</span>` : '';
      return `<div class="card">
        <div class="row"><div class="g">
          <div class="t">${esc(names[m.user_id]||'Athlete')} ${m.role!=='member'?`<span class="pill ok">${esc(m.role)}</span>`:''}</div>
          <div class="m">${total[m.user_id]||0} sessions · ${d===null?'no check-ins':'last '+(d===0?'today':d+'d ago')} · ${esc(m.status)}</div>
          ${benchLine(m.user_id)}
          <div style="margin-top:6px;">${flag}</div>
        </div></div>
        <div class="row" style="margin-top:10px;gap:6px;flex-wrap:wrap;">
          <select onchange="setStatus('${m.id}', this.value)" style="width:auto;padding:8px 10px;">
            ${['active','paused','inactive','expired'].map(s=>`<option ${m.status===s?'selected':''}>${s}</option>`).join('')}
          </select>
          <select onchange="setRole('${m.id}', this.value)" style="width:auto;padding:8px 10px;">
            ${['member','coach','admin'].map(s=>`<option ${m.role===s?'selected':''}>${s}</option>`).join('')}
          </select>
          <button class="sm" onclick="noteFor('${m.user_id}','${esc(names[m.user_id]||'Athlete')}')">Add note</button>
          ${curSession?`<button class="sm" onclick="markIn('${m.user_id}')">Mark in</button>`:''}
        </div></div>`;
    }).join('')}`;
}
async function searchAthletes(){
  const term=$('q-name').value.trim();
  if(term.length<2){ $('q-res').innerHTML=''; return; }
  const rows = await q(()=> sb.from('profiles').select('id,name,display_name,username,state')
      .or(`name.ilike.%${term}%,display_name.ilike.%${term}%,username.ilike.%${term}%`)
      .eq('is_demo', false).limit(8)) || [];
  $('q-res').innerHTML = rows.length ? rows.map(p=>`<div class="row" style="margin-top:9px;">
      <div class="g"><div class="t">${esc(p.display_name||p.name||('@'+p.username))}</div>
      <div class="m">${esc(p.state||'')}</div></div>
      <button class="sm" onclick="addMember('${p.id}')">Add</button></div>`).join('')
    : '<div class="m" style="margin-top:9px;">No athlete found.</div>';
}
async function addMember(userId){
  const r = await q(()=> sb.from('club_physical_members')
    .insert({ club_id: staff.club_id, user_id: userId, role:'member', status:'active' }).select());
  if(!r) return;
  toast('Member added ✓'); viewMembers();
}
async function setStatus(id, status){
  const r = await sb.from('club_physical_members').update({ status, updated_at:new Date().toISOString() }).eq('id', id);
  if(r.error) return toast(r.error.message);
  toast('Status updated ✓');
}
async function setRole(id, role){
  const r = await sb.from('club_physical_members').update({ role, updated_at:new Date().toISOString() }).eq('id', id);
  if(r.error) return toast(r.error.message);
  toast('Role updated ✓');
}
async function markIn(userId){
  if(!curSession) return toast('Open a session under Today first');
  const r = await q(()=> sb.rpc('club_mark_attendance', { p_session: curSession, p_user: userId }));
  if(r) toast('Marked in ✓');
}
async function noteFor(userId, name){
  const body = prompt('Coach note for '+name+':');
  if(!body || !body.trim()) return;
  const r = await q(()=> sb.from('club_notes').insert({
    club_id: staff.club_id, user_id: userId, coach_id: me.id,
    coach_name: (me.user_metadata && me.user_metadata.name) || 'Coach', body: body.trim()
  }).select());
  if(r) toast('Note saved ✓');
}

/* ---------- partner applications (HITFAT only) ----------
   Approving is one call to a database function rather than a series of writes
   from here: half an approval — a club with no admin, an admin pointing at no
   club — is worse than none, and a browser can close mid-way. */
async function viewPartners(){
  /* The ordering athletes never see. It is here because it answers an
     operations question — which clubs are alive, which need a call — and not
     a marketing one. */
  const board = await q(()=> sb.from('club_board').select('*')
      .order('active',{ascending:false}).limit(60)) || [];
  const rows = await q(()=> sb.from('club_applications').select('*').order('created_at',{ascending:false}).limit(50)) || [];
  const pending = rows.filter(r=> r.status==='pending');
  const done    = rows.filter(r=> r.status!=='pending');
  const card = r => `<div class="card">
      <div class="row"><div class="g">
        <div class="t">${esc(r.gym_name)} ${r.status!=='pending'?`<span class="pill ${r.status==='approved'?'ok':''}">${esc(r.status)}</span>`:''}</div>
        <div class="m">${esc([r.city, r.state].filter(Boolean).join(', ') || '—')}</div>
        <div class="m">${esc(r.owner_name||'')}${r.phone?' · '+esc(r.phone):''}${r.email?' · '+esc(r.email):''}</div>
        ${r.instagram?`<div class="m">${esc(r.instagram)}</div>`:''}
        ${r.classes?`<div class="note">${esc(r.classes)}</div>`:''}
      </div></div>
      ${r.status==='pending' ? `<div class="row" style="margin-top:10px;gap:6px;">
        <button class="p sm" onclick="approveApp('${r.id}')">Approve</button>
        <button class="sm dg" onclick="rejectApp('${r.id}')">Reject</button></div>` : ''}
    </div>`;
  const quiet = board.filter(b=> (b.active||0) === 0 && (b.members||0) > 0);
  $('body').innerHTML = `<h2>${pending.length} waiting</h2>`
    + (pending.length ? pending.map(card).join('') : '<div class="card"><div class="m">No applications waiting.</div></div>')
    + (done.length ? `<h2>Reviewed</h2>` + done.map(card).join('') : '')
    + `<h2>Network</h2>`
    + (board.length ? board.map(b=>`<div class="card"><div class="row">
        <div class="g"><div class="t">${esc(b.name)} ${b.partner_status==='hq'?'<span class="pill ok">HQ</span>':''}</div>
          <div class="m">${esc([b.city,b.state].filter(Boolean).join(', ')||'—')}</div>
          <div class="m">${b.members||0} athletes · <b>${b.active||0}</b> training this month${b.avg_score?` · avg score ${b.avg_score}`:''}</div>
          ${(b.active||0)===0 && (b.members||0)>0 ? '<div style="margin-top:6px;"><span class="pill warn">nobody trained this month</span></div>' : ''}
        </div></div></div>`).join('')
      : '<div class="card"><div class="m">No clubs yet.</div></div>')
    + `<div class="note">Athletes do not see this ordering. A club that has gone quiet is a call to make, not a rank to publish.${quiet.length?` ${quiet.length} club${quiet.length===1?'':'s'} quiet right now.`:''}</div>`;
}
async function approveApp(id){
  if(!confirm('Approve this gym? It becomes a partner club and the applicant becomes its admin.')) return;
  const r = await q(()=> sb.rpc('club_application_approve', { p_id: id }));
  if(!r) return;
  toast(r.already ? 'Already approved' : 'Approved ✓'); viewPartners();
}
async function rejectApp(id){
  const note = prompt('Reason (optional, kept internal):') || null;
  const r = await q(()=> sb.rpc('club_application_reject', { p_id: id, p_note: note }));
  if(r) { toast('Rejected'); viewPartners(); }
}

/* ---------- announcements ---------- */
async function viewNews(){
  const rows = await q(()=> sb.from('club_announcements').select('*').eq('club_id',staff.club_id)
      .order('created_at',{ascending:false}).limit(20)) || [];
  $('body').innerHTML = `<div class="card">
      <div class="t">New announcement</div>
      <label>Headline</label><input id="a-title" placeholder="Saturday session moved to 9:00 AM">
      <label>Detail (optional)</label><textarea id="a-body" rows="3"></textarea>
      <button class="p" style="width:100%;margin-top:12px;" onclick="createNews()">Post to club</button>
      <div class="note">Club members see this on their Club overview. It is not posted to the public community.</div>
    </div>
    <h2>Posted</h2>
    ${rows.length ? rows.map(a=>`<div class="card"><div class="row"><div class="g">
        <div class="t">${esc(a.title)}</div><div class="m">${esc(a.body||'')}</div>
        <div class="m">${fmtDay(a.created_at)}</div></div>
        <button class="sm dg" onclick="delNews('${a.id}')">Delete</button></div></div>`).join('')
      : '<div class="card"><div class="m">Nothing posted yet.</div></div>'}`;
}
async function createNews(){
  const title=$('a-title').value.trim(); if(!title) return toast('Write a headline');
  const r = await q(()=> sb.from('club_announcements').insert({
    club_id: staff.club_id, title, body:$('a-body').value.trim()||null, created_by: me.id }).select());
  if(!r) return; toast('Posted ✓'); viewNews();
}
async function delNews(id){
  const r = await sb.from('club_announcements').delete().eq('id', id);
  if(r.error) return toast(r.error.message);
  toast('Deleted'); viewNews();
}

boot();
</script>
</body></html>
